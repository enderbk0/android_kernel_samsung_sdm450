name: Build A11Q ReSukiSU kernel

on:
  push:
    branches: [resukisu-a11q, lineage-20]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev \
            cpio rsync curl git zip python3 kmod
          sudo ln -sf /usr/bin/python3 /usr/bin/python || true
          python --version
          gcc --version | head -1
          which ld gcc; ld --version | head -1

      - name: Attach ReSukiSU (non-GKI manual-hook tree)
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          test -L drivers/kernelsu && test -d KernelSU/kernel
          grep -q 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile
          grep -q 'CONFIG_KSU=y' arch/arm64/configs/a11q_open_defconfig
          grep -q 'CONFIG_KSU_MANUAL_HOOK=y' arch/arm64/configs/a11q_open_defconfig
          grep -q 'ksu_handle_execveat' fs/exec.c
          grep -q 'ksu_handle_faccessat' fs/open.c
          grep -q 'ksu_handle_sys_reboot' kernel/reboot.c

      - name: Fetch toolchains (shallow)
        run: |
          git config --global --unset-all http.https://github.com/.extraheader || true
          mkdir -p toolchain && cd toolchain
          git clone --depth 1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9
          git clone --depth 1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
            android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9
          # clang 10 (r353983c) via Android 11 release branch, mapped to the
          # llvm-arm-toolchain-ship-10.0 path build_kernel.sh expects
          git clone --depth 1 -b android11-d1-release \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            llvm-arm-toolchain-ship-10.0
          ls llvm-arm-toolchain-ship-10.0
          # normalize: some branches keep the prebuilt under a versioned subdir
          if [ ! -x llvm-arm-toolchain-ship-10.0/bin/clang ]; then
            CLANG_FILE=$(find llvm-arm-toolchain-ship-10.0 -maxdepth 3 -path '*/bin/clang' -type f | head -1)
            echo "clang at: $CLANG_FILE"
            SRC_DIR=$(dirname "$(dirname "$CLANG_FILE")")
            mv "$SRC_DIR" llvm-tmp && rm -rf llvm-arm-toolchain-ship-10.0 && mv llvm-tmp llvm-arm-toolchain-ship-10.0
          fi
          ls llvm-arm-toolchain-ship-10.0/bin/clang
          llvm-arm-toolchain-ship-10.0/bin/clang --version | head -1
          android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9/bin/aarch64-linux-android-gcc --version | head -1

      - name: Defconfig (a11q, 4.9.319-a11q_enderbk)
        run: |
          mkdir -p out
          make -C "$GITHUB_WORKSPACE" O="$GITHUB_WORKSPACE/out" \
            DTC_EXT="$GITHUB_WORKSPACE/tools/dtc" CONFIG_BUILD_ARM64_DT_OVERLAY=y \
            ARCH=arm64 \
            CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9/bin/aarch64-linux-android-" \
            CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchain/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9/bin/arm-linux-androideabi-" \
            CC="$GITHUB_WORKSPACE/toolchain/llvm-arm-toolchain-ship-10.0/bin/clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            a11q_open_defconfig
          grep -E '^CONFIG_LOCALVERSION=|^CONFIG_KSU=y|CONFIG_KSU_MANUAL_HOOK=y' out/.config

      - name: Build Image
        run: |
          make -C "$GITHUB_WORKSPACE" O="$GITHUB_WORKSPACE/out" \
            DTC_EXT="$GITHUB_WORKSPACE/tools/dtc" CONFIG_BUILD_ARM64_DT_OVERLAY=y \
            ARCH=arm64 \
            CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9/bin/aarch64-linux-android-" \
            CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchain/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9/bin/arm-linux-androideabi-" \
            CC="$GITHUB_WORKSPACE/toolchain/llvm-arm-toolchain-ship-10.0/bin/clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            -j"$(nproc)"
          ls -lh out/arch/arm64/boot/Image*
          file out/arch/arm64/boot/Image || true

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Image-a11q_enderbk-${{ github.sha }}
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/**/*.dtb
          if-no-files-found: warn
